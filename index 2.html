<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ขอคืนดีกันนะ ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#ffd6e7,#fff0f5);
  overflow:hidden;
}
.card{
  width:min(90%,420px); padding:38px 25px; text-align:center;
  background:rgba(255,255,255,.94); border-radius:28px;
  box-shadow:0 15px 50px rgba(190,80,120,.2);
}
.heart{font-size:58px; animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.12)}}
h1{color:#e75480;margin:12px 0;font-size:30px}
p{color:#666;font-size:18px;line-height:1.7}
.message{min-height:58px;color:#d84c76;font-weight:600}
.buttons{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:22px}
button{
  border:0;border-radius:999px;padding:14px 24px;font-size:17px;
  cursor:pointer;transition:.2s;
}
.yes{background:#e75480;color:white;box-shadow:0 8px 18px rgba(231,84,128,.25)}
.no{background:#f1f1f1;color:#777}
.yes:hover{transform:scale(1.05)}
.small{font-size:13px;color:#aaa;margin-top:22px}
.confetti{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="card">
  <div class="heart">❤️</div>
  <h1>ดีกันนะ</h1>
  <p>พี่อาจจะทำให้หนูเสียใจ<br>แต่พี่อยากแก้ไขจริง ๆ นะ</p>
  <div class="message" id="message">เลือกคำตอบให้พี่หน่อยนะ 🥺</div>
  <div class="buttons">
    <button class="yes" onclick="yes()">ดีกันนะ ❤️</button>
    <button class="no" id="noBtn" onclick="no()">ไม่ 😤</button>
  </div>
  <div class="small">ไม่ว่าจะเลือกอะไร พี่ก็ยังอยากง้อหนูอยู่ดี</div>
</div>

<script>
let count=0;
const messages=[
 "ไม่เป็นไรนะ 🥺 ยังไงก็จะง้อต่อไปนะ",
 "ยังไม่ใจอ่อนเหรอ 🥹 พี่ยังอยู่นะ",
 "โอเค พี่รอได้ ❤️ แต่จะง้อต่อไปนะ",
 "ปฏิเสธได้ แต่ห้ามห้ามพี่คิดถึงนะ 😭",
 "พี่ขอโอกาสอีกครั้งได้ไหม 🥺",
 "ไม่เป็นไรนะ... ยังไงก็จะง้อต่อไปนะ ❤️"
];

function no(){
  count++;
  document.getElementById("message").textContent =
    messages[Math.min(count-1,messages.length-1)];
  const btn=document.getElementById("noBtn");
  if(count>=3){
    btn.textContent="ยังไม่ดีกัน 😭";
    btn.style.transform=`translate(${Math.random()*80-40}px,${Math.random()*50-25}px)`;
  }
}
function yes(){
  document.querySelector(".card").innerHTML=`
    <div class="heart">🥰</div>
    <h1>เย้! ดีกันแล้วนะ ❤️</h1>
    <p>ขอบคุณที่ให้โอกาสพี่นะ<br>พี่จะพยายามทำให้ดีขึ้นจริง ๆ</p>
    <div style="font-size:28px;margin-top:18px">🫶🏻💗🫶🏻</div>
  `;
}
</script>
</body>
</html>
